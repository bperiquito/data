<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruna Periquito — Trust & Safety · Data Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--surface:#fff;--ink:#1d1b20;--muted:#6a6670;--line:#e6e0d6;--accent:#c8462b;--accent-soft:#f8e4de;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131a;--surface:#1f1c26;--ink:#f1ece4;--muted:#a49fab;--line:#322e3b;--accent:#ff7a5c;--accent-soft:#3a231e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131a;--surface:#1f1c26;--ink:#f1ece4;--muted:#a49fab;--line:#322e3b;--accent:#ff7a5c;--accent-soft:#3a231e;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:6px;height:56px;overflow-x:auto}
nav a{text-decoration:none;font-size:14px;color:var(--muted);padding:6px 10px;border-radius:99px;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--accent-soft)}
nav .sp{flex:1}
#theme,#lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.hero{padding:72px 0 48px}
.eyebrow{color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.hero h1{font-size:clamp(40px,8vw,68px);margin:10px 0 14px}
.hero p.lead{font-size:20px;color:var(--muted);max-width:620px;margin:0 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;padding:11px 20px;border-radius:99px;text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--ink)}
.btn.p{background:var(--ink);color:var(--bg)}
.btn:hover{transform:translateY(-1px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:40px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{font-family:Fraunces,Georgia,serif;font-size:30px;color:var(--accent);display:block}
.stat span{font-size:14px;color:var(--muted)}
section{padding:46px 0}
h2{font-size:32px;margin-bottom:22px}
h2 small{display:block;font:600 13px Inter,sans-serif;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tag{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:15px;transition:.2s}
.tag.learn{border-style:dashed}
.tag.hide{display:none}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.item>button{all:unset;box-sizing:border-box;display:flex;width:100%;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;cursor:pointer}
.item>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item h3{font-size:20px}
.item .meta{color:var(--muted);font-size:14px}
.item .pl{color:var(--accent);font-size:24px;transition:transform .2s}
.item.open .pl{transform:rotate(45deg)}
.item .body{display:none;padding:0 20px 18px}
.item.open .body{display:block}
.item ul{margin:0;padding-left:20px}
.item li{margin:5px 0}
.cert{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cert.hide{display:none}
.cert i{font-style:normal;color:var(--muted);font-size:14px;white-space:nowrap}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.lang{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.lang b{display:flex;justify-content:space-between}
.bar{height:6px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width 1s}
.contact{background:var(--ink);color:var(--bg);border-radius:24px;padding:36px;text-align:center}
.contact h2{margin-bottom:10px}
.contact .btn{border-color:var(--bg);color:var(--bg);margin:6px 4px}
.contact .btn.p{background:var(--bg);color:var(--ink)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px 0 40px}
.fade{opacity:0;transform:translateY(14px);transition:.6s}
.fade.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
#lang{font-weight:600}.id{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ph{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);flex:none}
.id h1{margin:6px 0 0}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px}
.badge{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;padding:4px 12px;border-radius:99px}
.proj h3{font-size:26px;margin:12px 0 8px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 10px}
.step{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 8px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;text-align:center}
.step b{display:block;font-family:Fraunces,Georgia,serif;font-size:20px;color:var(--accent)}
.step[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.step[aria-pressed="true"] b{color:#fff}
.stext{background:var(--accent-soft);border-radius:14px;padding:14px 16px;min-height:3.4em}
.find{margin:8px 0 0;padding-left:20px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.fig{all:unset;box-sizing:border-box;display:block;cursor:zoom-in;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fig:focus-visible{outline:2px solid var(--accent)}
.fig img{width:100%;height:170px;object-fit:contain;display:block;background:#fff}
.fig span{display:block;padding:8px 10px;font-size:13px;color:var(--muted);background:var(--surface)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:20px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:10px;background:#fff}
.item.hl{border-left:4px solid var(--accent)}
@media(max-width:560px){.steps{grid-template-columns:repeat(2,1fr)}}
button.btn{background:none;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.menu{display:none;flex-direction:column;gap:8px;max-width:300px;margin:14px auto 0}.menu.on{display:flex}
</style>
</head>

function render(){var d=T[L];document.documentElement.lang=L;$("lang").textContent=L=="en"?"PT":"EN";
[].forEach.call(document.querySelectorAll("[data-i18n]"),function(e){e.textContent=d[e.dataset.i18n]});$("copy").textContent=d.cC;
chips($("skillChips"),d.cats,sc,function(i){sc=i;render()});
$("skillTags").innerHTML=d.sk.map(function(n,i){return (sc&&skc[i]!=sc-1)?"":'<span class="tag'+(skl.indexOf(i)>-1?' learn':'')+'">'+n+'</span>'}).join("");
$("exp").innerHTML=d.exp.map(function(e,i){return '<div class="item'+((i==0||e.hl)?' open':'')+(e.hl?' hl':'')+'"><button aria-expanded="'+(i==0||!!e.hl)+'"><span><h3>'+e.t+'</h3><span class="meta">'+e.c+' · '+e.d+'</span></span><span class="pl">+</span></button><div class="body"><ul>'+e.b.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul></div></div>'}).join("");
[].forEach.call(document.querySelectorAll("#exp .item button"),function(b){b.onclick=function(){var it=b.parentNode;it.classList.toggle("open");b.setAttribute("aria-expanded",it.classList.contains("open"))}});
chips($("certChips"),d.yrs,yc,function(i){yc=i;render()});
var ys=["","2026","2025","o"];
$("certs").innerHTML=d.certs.map(function(c,i){return (yc&&cy[i]!=ys[yc])?"":'<div class="cert"><span>'+c+'</span><i>'+(cy[i]=="o"?"":cy[i])+'</i></div>'}).join("");
$("langs").innerHTML=d.lg.map(function(n,i){return '<div class="lang"><b><span>'+n+'</span><span style="color:var(--accent)">'+d.ln[i]+'</span></b><div class="bar"><span style="width:'+lv[i]+'%"></span></div></div>'}).join("");proj()}
function proj(){var p=T[L].p;$("pBadge").textContent=p.badge;$("pName").textContent=p.name;$("pSum").textContent=p.sum;$("pFT").textContent=p.fT;$("pHint").textContent=p.hint;
$("steps").innerHTML=p.steps.map(function(s,i){return '<button class="step" data-i="'+i+'" aria-pressed="'+(i==pst)+'"><b>'+(i+1)+'</b>'+s.t+'</button>'}).join("");
[].forEach.call(document.querySelectorAll(".step"),function(b){b.onclick=function(){pst=+b.dataset.i;proj()}});
$("stext").textContent=p.steps[pst].d;
$("pF").innerHTML=p.f.map(function(x){return '<li>'+x+'</li>'}).join("");
$("pTools").innerHTML=p.tools.map(function(x){return '<span class="tag">'+x+'</span>'}).join("");
$("figs").innerHTML=p.figs.map(function(c,i){return '<button class="fig" data-i="'+i+'"><img src="'+IMG[i]+'" alt="'+c+'"><span>'+c+'</span></button>'}).join("");
[].forEach.call(document.querySelectorAll(".fig"),function(b){b.onclick=function(){var im=$("lb").firstChild;im.src=IMG[+b.dataset.i];im.alt=p.figs[+b.dataset.i];$("lb").classList.add("on")}})}
$("projItem").firstChild.onclick=function(){var it=$("projItem");it.classList.toggle("open");this.setAttribute("aria-expanded",it.classList.contains("open"))};
$("copy").onclick=function(){var m="brunaperiquito@hotmail.com",b=this;function ok(){b.textContent=T[L].cK;setTimeout(function(){b.textContent=T[L].cC},1800)}function fb(){var t=document.createElement("textarea");t.value=m;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(t)}try{navigator.clipboard.writeText(m).then(ok,fb)}catch(e){fb()}};
$("mailBtn").onclick=function(){var m=$("mailMenu");m.classList.toggle("on");this.setAttribute("aria-expanded",m.classList.contains("on"))};
$("lb").onclick=function(){$("lb").classList.remove("on")};
document.addEventListener("keydown",function(e){if(e.key=="Escape")$("lb").classList.remove("on")});
function count(el){var n=+el.dataset.n,s=el.dataset.s||"",k=0,t=setInterval(function(){k++;el.textContent=Math.round(n*k/30)+(k>=30?s:"");if(k>=30)clearInterval(t)},30)}
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.15});
[].forEach.call(document.querySelectorAll(".fade"),function(s){io.observe(s)});
[].forEach.call(document.querySelectorAll("[data-n]"),count);
$("lang").onclick=function(){L=L=="en"?"pt":"en";try{localStorage.setItem("lang",L)}catch(e){}render()};
$("theme").onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
render();
</script>
